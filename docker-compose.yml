services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ict_user
      POSTGRES_PASSWORD: ict_pass
      POSTGRES_DB: ict_tickets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ict_user -d ict_tickets"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://ict_user:ict_pass@db:5432/ict_tickets
      JWT_SECRET_KEY: change-me-in-production-use-a-long-random-string
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend:ro
    restart: unless-stopped

volumes:
  postgres_data:
